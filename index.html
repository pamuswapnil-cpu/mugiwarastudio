<!DOCTYPE html>
<html>
<head>
  <title>MUGIWARA STUDIO</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body{
      margin:0;
      background:#0B0B0B;
      color:white;
      font-family:Arial;
    }

    header{
      text-align:center;
      padding:120px 20px;
    }

    h1{
      font-size:70px;
      margin-bottom:10px;
    }

    p{
      color:#cccccc;
      font-size:22px;
    }

    .btn{
      display:inline-block;
      margin-top:30px;
      background:#7CFF00;
      color:black;
      padding:15px 35px;
      text-decoration:none;
      border-radius:10px;
      font-weight:bold;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      padding:40px;
    }

    .card{
      background:#161616;
      padding:20px;
      border-radius:15px;
      text-align:center;
    }

    .card img{
      width:100%;
      border-radius:10px;
    }

    footer{
      text-align:center;
      padding:30px;
      color:#777;
    }

  </style>

</head>

<body>

<header>

  <h1>MUGIWARA STUDIO</h1>

  <p>Built Through Scars.</p>

  <a class="btn" href="#">SHOP NOW</a>

</header>

<section class="products">

  <div class="card">

    <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab">

    <h2>Zoro Oversized Tee</h2>

    <p>₹999</p>

  </div>

  <div class="card">

    <img src="https://images.unsplash.com/photo-1503341504253-dff4815485f1">

    <h2>Luffy Motivation Tee</h2>

    <p>₹999</p>

  </div>

  <div class="card">

    <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f">

    <h2>Dreams Never Die Tee</h2>

    <p>₹1199</p>

  </div>

</section>

<footer>

© 2026 MUGIWARA STUDIO

</footer>

</body>
</html>
